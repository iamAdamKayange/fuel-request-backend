name: Database Backup

on:
  schedule:
    - cron: "0 23 * * *"

  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PostgreSQL 18 client
        run: |
          docker run --rm postgres:18 pg_dump --version

      - name: Make backup script executable
        run: chmod +x scripts/backup-database.sh

      - name: Run database backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -v "${{ github.workspace }}/scripts:/scripts:ro" \
            -v "${{ github.workspace }}/backups:/backups" \
            postgres:18 \
            bash -c '
              chmod +x /scripts/backup-database.sh
              BACKUP_DIR=/backups /scripts/backup-database.sh
            '

      - name: List backup files
        run: |
          ls -lh backups/
