name: Database Backup

on:
  schedule:
    # 23:00 UTC = 02:00 Tanzania time
    - cron: "0 23 * * *"

  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PostgreSQL 18
        uses: tj-actions/install-postgresql@v4
        with:
          postgresql-version: "18"

      - name: Verify PostgreSQL version
        run: |
          which pg_dump
          pg_dump --version

      - name: Make backup script executable
        run: chmod +x scripts/backup-database.sh

      - name: Run database backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ./scripts/backup-database.sh
